run_command:
  name: Run Command
  description: >
    Run a shell command on a MeshCentral-managed device.
    The device must be online and have an active agent.
  fields:
    device_id:
      name: Device ID or Name
      description: The MeshCentral node ID or device name (e.g. "fedora" or "ASUS-GamerPC")
      required: true
      example: "fedora"
      selector:
        text:
    command:
      name: Command
      description: Shell command to execute on the remote device
      required: true
      example: "shutdown /s /t 60"
      selector:
        text:
    run_as_user:
      name: Run in interactive user session
      description: >
        Request MeshCentral runAsUser mode 2. On Windows this targets the
        interactive session, but the agent may retain its service security token.
      required: false
      default: false
      selector:
        boolean:
    wait_for_output:
      name: Wait for command output
      description: >
        Wait for the remote process to exit and return output. Disable this for
        screensavers, GUI applications, and other long-running commands.
      required: false
      default: true
      selector:
        boolean:
    powershell:
      name: PowerShell
      description: Execute the command using MeshCentral PowerShell command type 2.
      required: false
      default: false
      selector:
        boolean:
    notify:
      name: Notify
      description: >
        Create a persistent notification in Home Assistant with the command output.
        A "meshcentral_command_result" event is always fired regardless of this setting.
      required: false
      default: false
      selector:
        boolean:

run_console_command:
  name: Run Console Command
  description: >
    Send one of MeshCentral's built-in agent console commands (e.g. "apf cira",
    "info") — not an OS shell command, see the run_command service for that.
    Send "help" to list available commands for a device. Requires the account
    to hold the "agentconsole" right on the device or mesh; without it,
    MeshCentral accepts the request but never replies, and this will time out.
  fields:
    device_id:
      name: Device ID or Name
      description: The MeshCentral node ID or device name (e.g. "fedora" or "ASUS-GamerPC")
      required: true
      example: "fedora"
      selector:
        text:
    command:
      name: Console Command
      description: >
        MeshCentral agent console command to send, e.g. "help", "info", "apf cira".
      required: true
      example: "help"
      selector:
        text:
    notify:
      name: Notify
      description: >
        Create a persistent notification in Home Assistant with the command output.
        A "meshcentral_console_command_result" event is always fired regardless
        of this setting.
      required: false
      default: false
      selector:
        boolean:
